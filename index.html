<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Day</title>
<style>
/* ===== Colors (dark mode just swaps these variables) ===== */
:root{--bg:#f3f4f8;--card:rgba(255,255,255,.82);--tx:#1c1c28;--mut:#777;--ac:#5b4bdb;--bd:#e2e3ee}
body.dark{--bg:#12121a;--card:rgba(34,34,50,.82);--tx:#eee;--mut:#9a9ab0;--bd:#2f2f44}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;transition:background .3s}

/* ===== Layout ===== */
#nav{width:220px;padding:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto;border-right:1px solid var(--bd)}
#nav a{display:flex;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.2s}
#nav a:hover{background:var(--bd)}
#nav a.on{background:var(--ac);color:#fff}
#nav em{font-style:normal}
main{flex:1;padding:20px;max-width:900px;margin:auto;width:100%}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header h1{flex:1;margin:0;font-size:26px}
#clock{color:var(--mut);font-variant-numeric:tabular-nums}

/* ===== Cards, buttons, inputs ===== */
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;font-size:14px;display:inline-block}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.danger{background:#d64545}
input,select,textarea{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 10px;font-size:15px}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mut)}
.item{display:flex;align-items:center;gap:8px}
.item.done b{text-decoration:line-through;opacity:.5}
.item button{background:none;border:0;cursor:pointer;font-size:16px}
.grow{flex:1;min-width:0}
small{display:block;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end}
label.row{justify-content:space-between;color:var(--tx)}
.row input{margin:0}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .card{text-align:center;font-size:18px}

/* ===== Progress bars and charts ===== */
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.hb{display:grid;grid-template-columns:100px 1fr 50px;gap:8px;align-items:center;font-size:13px}
.hb i{height:10px;background:var(--ac);border-radius:6px;transition:width .4s}

/* ===== Messages ===== */
.chat{display:grid;grid-template-columns:200px 1fr;gap:10px}
.ct{padding:8px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.ct.on{background:var(--bd)}
.av{background:var(--ac);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.msgs{min-height:220px}
.bubble{background:var(--ac);color:#fff;padding:8px 12px;border-radius:16px 16px 4px 16px;margin:6px 0 6px auto;width:fit-content;max-width:80%}
.bubble small{color:#ffffffb0}
.bubble a{cursor:pointer}

/* ===== Modal and toast ===== */
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:9;padding:14px}
.modal.hidden{display:none}
.box{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.err{color:#d64545;min-height:18px;margin:0 0 8px;font-size:14px}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:var(--ac);color:#fff;padding:12px 18px;border-radius:14px;z-index:10;transition:transform .3s}
#toast.show{transform:translate(-50%,0)}

.tm{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.tm label{width:84px;text-align:center}
.ringbox{position:relative;width:min(86vw,380px);margin:14px auto}
.ringbox svg{width:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--bd);stroke-width:10}
.rfg{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;stroke-dasharray:565;transition:stroke-dashoffset .3s linear}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px,13vw,76px);font-weight:700;font-variant-numeric:tabular-nums}
#cdcard:fullscreen,#cdcard:-webkit-full-screen{background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center}
#cdcard:fullscreen .ringbox{width:min(75vh,85vw)}#cdcard:fullscreen #cd{font-size:clamp(60px,14vw,160px)}
/* ===== Mobile: sidebar becomes a bottom bar ===== */
@media(max-width:700px){
  body{display:block}
  #nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);z-index:5;padding:6px}
  #nav a{flex-direction:column;align-items:center;font-size:10px;flex:0 0 auto;padding:6px 10px}
  main{padding:14px 14px 90px}
  .chat{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style></head><body>
<nav id="nav"></nav>
<main><header><h1 id="title"></h1><span id="clock"></span><button id="addBtn" class="btn">＋</button></header><section id="view"></section></main>
<div id="modal" class="modal hidden"></div><div id="toast"></div>
<script>
/* ================= STORAGE ================= */
// Every list lives in LocalStorage under its own key.
const KEYS = ['tasks','notes','contacts','messages','reminders','shopping','expenses','goals'];
const db = {};
KEYS.forEach(k => db[k] = JSON.parse(localStorage.getItem(k) || '[]'));
let settings = JSON.parse(localStorage.getItem('settings') || '{"dark":false,"lang":"en","h24":true}');
const saveKey = k => localStorage.setItem(k, JSON.stringify(db[k]));
const saveSettings = () => localStorage.setItem('settings', JSON.stringify(settings));

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const findItem = (k, id) => db[k].find(i => i.id === id);
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const todayStr = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
let view = 'home', chat = null, q = '';

/* ================= TRANSLATIONS ================= */
// Values are listed in the same order as the keys in K.
const K = 'home,tasks,notes,messages,contacts,reminders,shopping,expenses,goals,tools,settings,save,cancel,empty,sure,hello,dark,lang,export,import,reset,title,date,due,priority,amount,name,phone,time,price'.split(',');
const L = {
  en: 'Home|Tasks|Notes|Messages|Contacts|Reminders|Shopping|Money|Goals|Tools|Settings|Save|Cancel|Nothing here yet|Are you sure?|Hello|Dark mode|Language|Export my data|Import data|Delete all data|Title|Date|Due|Priority|Amount|Name|Phone|Time|Price',
  hy: 'Գլխավոր|Առաջադրանքներ|Նշումներ|Հաղորդագրություններ|Կոնտակտներ|Հիշեցումներ|Գնումներ|Ֆինանսներ|Նպատակներ|Գործիքներ|Կարգավորումներ|Պահպանել|Չեղարկել|Դեռ ոչինչ չկա|Համոզվա՞ծ եք|Բարև|Մութ ռեժիմ|Լեզու|Արտահանել տվյալները|Ներմուծել տվյալներ|Ջնջել բոլոր տվյալները|Վերնագիր|Ամսաթիվ|Ժամկետ|Առաջնահերթություն|Գումար|Անուն|Հեռախոս|Ժամ|Գին',
  ru: 'Главная|Задачи|Заметки|Сообщения|Контакты|Напоминания|Покупки|Финансы|Цели|Инструменты|Настройки|Сохранить|Отмена|Пока ничего нет|Вы уверены?|Привет|Тёмная тема|Язык|Экспорт данных|Импорт данных|Удалить все данные|Название|Дата|Срок|Приоритет|Сумма|Имя|Телефон|Время|Цена'
};
const tr = k => { const i = K.indexOf(k); return i < 0 ? k : L[settings.lang].split('|')[i]; };

/* ================= DATA MODELS =================
   Each module lists its form fields: [name, type, options, required]
   t = how to show the title, sub = subtitle line, check = has a checkbox */
const M = {
  tasks:{f:[['title','text',0,1],['due','date'],['priority','select',['Low','Medium','High']]],check:1,sub:i=>[i.due,i.priority].filter(Boolean).join(' · ')},
  notes:{f:[['title','text',0,1],['text','textarea'],['pinned','check']],sub:i=>(i.pinned?'📌 ':'')+(i.text||''),sort:(a,b)=>!!b.pinned-!!a.pinned},
  contacts:{f:[['name','text',0,1],['phone','text'],['email','text'],['birthday','date']],t:i=>i.name,sub:i=>[i.phone,i.email].filter(Boolean).join(' · '),msg:1},
  reminders:{f:[['title','text',0,1],['date','date'],['time','time']],sub:i=>[i.date,i.time].join(' ')},
  shopping:{f:[['title','text',0,1],['qty','number'],['price','number']],check:1,sub:i=>`${i.qty||1} × ${i.price||0}`},
  goals:{f:[['title','text',0,1],['deadline','date'],['progress','number']],goal:1,sub:i=>i.deadline||''},
  expenses:{f:[['type','select',['Expense','Income']],['amount','number',0,1],['category','select',['Food','Transport','Shopping','Education','Entertainment','Other']],['desc','text'],['date','date']],
    t:i=>`${i.type==='Income'?'+':'−'}${i.amount} · ${i.category}`,sub:i=>[i.desc,i.date].filter(Boolean).join(' · ')}
};

/* ================= MODAL ================= */
// Shows a form; onSave(form) returns an error string or nothing.
function modal(html, onSave, ok) {
  const m = $('#modal');
  m.innerHTML = `<form class="box" novalidate>${html}<div class="row"><button type="button" class="btn ghost" id="cx">${tr('cancel')}</button><button type="button" class="btn" id="sv">${ok || tr('save')}</button></div></form>`;
  m.classList.remove('hidden');
  const f = m.firstChild;
  m.onclick = e => { if (e.target === m) closeModal(); };
  $('#cx').onclick = closeModal;
  // Save runs inside try/catch so any problem is shown instead of silently failing
  const submit = () => {
    let err;
    try { err = onSave(f); } catch (ex) { err = 'Error: ' + ex.message; }
    if (err) { const box = f.querySelector('.err'); if (box) box.textContent = err; else toast(err); return; }
    closeModal();
    try { render(); } catch (ex) { toast('Error: ' + ex.message); }
  };
  $('#sv').onclick = submit;
  f.onsubmit = ev => { ev.preventDefault(); submit(); };
}
const closeModal = () => $('#modal').classList.add('hidden');
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

/* ================= CREATE / EDIT / DELETE ================= */
function openForm(k, item) {
  const v = item || {};
  const fields = M[k].f.map(([n, type, o]) => {
    let input;
    if (type === 'select') input = `<select name="${n}">${o.map(x => `<option ${v[n] === x ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
    else if (type === 'textarea') input = `<textarea name="${n}" rows="4">${esc(v[n])}</textarea>`;
    else if (type === 'check') input = `<input type="checkbox" name="${n}" ${v[n] ? 'checked' : ''}>`;
    else input = `<input type="${type}" name="${n}" value="${esc(v[n])}">`;
    return `<label>${esc(tr(n))}${input}</label>`;
  }).join('');
  modal(`<h2>${tr(k)}</h2>${fields}<p class="err"></p>`, f => {
    const d = {};
    for (const [n, type, , req] of M[k].f) {
      const e = f.querySelector('[name="'+n+'"]');
      d[n] = type === 'check' ? e.checked : e.value.trim();
      if (req && !d[n]) return `Please enter: ${tr(n)}`;              // validation
      if (type === 'number' && d[n] !== '') {
        if (isNaN(d[n]) || +d[n] < 0) return 'Please enter a valid amount.';
        d[n] = +d[n];
      }
    }
    if (k === 'goals') d.progress = Math.min(100, d.progress || 0);
    if (item) Object.assign(item, d); else db[k].push({ id: uid(), done: false, ...d });
    saveKey(k);
  });
}
function del(k, id) {
  modal(`<p>${tr('sure')}</p>`, () => { db[k] = db[k].filter(i => i.id !== id); saveKey(k); }, '🗑');
}
function toggle(k, id) { const i = findItem(k, id); i.done = !i.done; saveKey(k); render(); }
function step(id, d) { const g = findItem('goals', id); g.progress = Math.min(100, Math.max(0, (+g.progress || 0) + d)); saveKey('goals'); render(); }

/* ================= MESSAGES ================= */
function addMsg(to, text) {
  const m = { id: uid(), to, text, time: Date.now(), status: 'Sent' };
  db.messages.push(m); saveKey('messages');
  // Local demo only: nothing is sent anywhere. Status changes are simulated.
  setTimeout(() => setStatus(m, 'Delivered'), 1000);
  setTimeout(() => setStatus(m, 'Read'), 2500);
}
function setStatus(m, s) { m.status = s; saveKey('messages'); if (view === 'messages') render(); }
function openMsg(id) {
  if (!db.contacts.length) { toast('Add a contact first'); return openForm('contacts'); }
  modal(`<h2>${tr('messages')}</h2><label>To<select name="to">${db.contacts.map(c => `<option value="${c.id}" ${c.id === id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label><label>Message<textarea name="text" rows="4"></textarea></label><p class="err"></p>`, f => {
    const text = f.querySelector('[name=text]').value.trim();
    if (!text) return 'Please write a message.';
    addMsg(f.querySelector('[name=to]').value, text); chat = f.querySelector('[name=to]').value; view = 'messages';
  });
}
function sendMsg(e) {
  e.preventDefault();
  const text = $('#mi').value.trim();
  if (!chat) return toast('Add a contact first');
  if (!text) return toast('Please write a message.');
  addMsg(chat, text); render();
}
// Opens the real app (mail, SMS, WhatsApp, Telegram, Viber) with the text prefilled.
// Nothing is sent from here: you press Send inside that app.
function shareMsg(app) {
  const c = findItem('contacts', chat);
  if (!c) return toast('Add a contact first');
  const inp = $('#mi').value.trim(), last = db.messages.filter(m => m.to === chat).pop();
  const text = inp || (last && last.text);
  if (!text) return toast('Please write a message.');
  const tel = (c.phone || '').replace(/\D/g, ''), t = encodeURIComponent(text);
  const urls = {
    mail: c.email && `mailto:${c.email}?subject=&body=${t}`,
    sms: tel && `sms:${c.phone.replace(/\s/g, '')}?&body=${t}`,
    whatsapp: tel && `https://wa.me/${tel}?text=${t}`,
    telegram: `https://t.me/share/url?url=%20&text=${t}`,
    viber: `viber://forward?text=${t}`
  };
  const url = urls[app];
  if (!url) return toast(app === 'mail' ? 'This contact has no email.' : 'This contact has no phone number.');
  if (url.startsWith('http')) window.open(url, '_blank'); else location.href = url;
  if (inp) { addMsg(chat, inp); $('#mi').value = ''; render(); }
}
function delMsg(id) { db.messages = db.messages.filter(m => m.id !== id); saveKey('messages'); render(); }
function msgView() {
  if (!findItem('contacts', chat) && db.contacts.length) chat = db.contacts[0].id;
  const ms = db.messages.filter(m => m.to === chat);
  return `<div class="chat"><div class="card">${db.contacts.map(c => `<div class="ct ${c.id === chat ? 'on' : ''}" onclick="chat='${c.id}';render()"><span class="av">${esc(c.name[0])}</span>${esc(c.name)}</div>`).join('') || `<p class="empty">${tr('empty')}</p>`}<button class="btn" onclick="openForm('contacts')">＋ ${tr('contacts')}</button></div>
  <div class="card"><div class="msgs">${ms.map(m => `<div class="bubble">${esc(m.text)}<small>${m.status} · ${new Date(m.time).toLocaleTimeString()} <a onclick="delMsg('${m.id}')">🗑</a></small></div>`).join('')}</div>
  <form onsubmit="sendMsg(event)" class="row"><input id="mi" placeholder="${tr('messages')}…"><button class="btn">➤</button></form><div class="tm"><button class="btn ghost" onclick="shareMsg('mail')">📧 Email</button><button class="btn ghost" onclick="shareMsg('sms')">💬 SMS</button><button class="btn ghost" onclick="shareMsg('whatsapp')">WhatsApp</button><button class="btn ghost" onclick="shareMsg('telegram')">Telegram</button><button class="btn ghost" onclick="shareMsg('viber')">Viber</button></div></div></div>`;
}

/* ================= GENERIC LIST VIEW ================= */
function listItems(k) {
  const m = M[k], title = m.t || (i => i.title);
  const items = db[k].filter(i => JSON.stringify(i).toLowerCase().includes(q.toLowerCase()));
  if (m.sort) items.sort(m.sort);
  if (!items.length) return `<p class="empty">📭 ${tr('empty')}</p>`;
  return items.map(i => `<div class="card item ${i.done ? 'done' : ''}">
    ${m.check ? `<input type="checkbox" ${i.done ? 'checked' : ''} onchange="toggle('${k}','${i.id}')">` : ''}
    <div class="grow"><b>${esc(title(i))}</b><small>${esc(m.sub ? m.sub(i) : '')}</small>
      ${m.goal ? `<div class="bar"><i style="width:${+i.progress || 0}%"></i></div>` : ''}</div>
    ${m.goal ? `<button onclick="step('${i.id}',-10)">−</button><small>${+i.progress || 0}%</small><button onclick="step('${i.id}',10)">＋</button>` : ''}
    ${m.msg ? `<button onclick="openMsg('${i.id}')">✉️</button>` : ''}
    <button onclick="openForm('${k}',findItem('${k}','${i.id}'))">✏️</button>
    <button onclick="del('${k}','${i.id}')">🗑</button></div>`).join('');
}
function modView(k) {
  let head = '';
  if (k === 'expenses') {
    const ex = db.expenses.filter(e => e.type === 'Expense'), inc = sum(db.expenses.filter(e => e.type === 'Income').map(e => e.amount)), out = sum(ex.map(e => e.amount));
    const cats = {}; ex.forEach(e => cats[e.category] = (cats[e.category] || 0) + +e.amount);
    const mx = Math.max(1, ...Object.values(cats));
    head = `<div class="stats"><div class="card">💵 ${inc}</div><div class="card">💸 ${out}</div><div class="card">⚖️ ${inc - out}</div></div>` +
      (ex.length ? `<div class="card">${Object.entries(cats).map(([c, v]) => `<div class="hb"><span>${c}</span><i style="width:${v / mx * 100}%"></i><b>${v}</b></div>`).join('')}</div>` : '');
  }
  if (k === 'shopping') {
    const s = db.shopping;
    head = `<div class="stats"><div class="card">🛒 ${s.length}</div><div class="card">✔ ${s.filter(i => i.done).length}</div><div class="card">≈ ${sum(s.map(i => (i.qty || 1) * (i.price || 0)))}</div></div>`;
  }
  return head + `<input placeholder="🔍" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=listItems('${k}')"><div id="list">${listItems(k)}</div>`;
}

/* ================= HOME ================= */
function home() {
  const today = todayStr(), tt = db.tasks.filter(t => t.due === today), done = tt.filter(t => t.done).length;
  const pct = tt.length ? Math.round(done / tt.length * 100) : 0;
  const rem = db.reminders.filter(r => r.date >= today).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).slice(0, 3);
  return `<div class="card"><h2>${tr('hello')}! 👋</h2><small>${new Date().toLocaleDateString(settings.lang, { dateStyle: 'full' })}</small></div>
  <div class="grid"><button class="btn" onclick="openForm('tasks')">✅ ＋</button><button class="btn" onclick="openMsg()">✉️ ＋</button><button class="btn" onclick="openForm('notes')">📝 ＋</button><button class="btn" onclick="openForm('reminders')">🔔 ＋</button><button class="btn" onclick="openForm('expenses')">💰 ＋</button></div><br>
  <div class="card"><b>${tr('tasks')}: ${done}/${tt.length}</b><div class="bar"><i style="width:${pct}%"></i></div>${tt.map(t => `<div class="${t.done ? 'item done' : ''}"><b>${esc(t.title)}</b></div>`).join('') || `<small>${tr('empty')}</small>`}</div>
  <div class="card"><b>${tr('reminders')}</b>${rem.map(r => `<small>🔔 ${esc(r.title)} · ${r.date} ${r.time}</small>`).join('') || `<small>${tr('empty')}</small>`}</div>
  <div class="card"><b>${tr('notes')}: ${db.notes.length}</b></div>`;
}

/* ================= TOOLS: stopwatch + countdown ================= */
let sw = { t: 0, id: 0 }, cdId = 0;
const fmt = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') + '.' + Math.floor(ms % 1000 / 100); };
function swToggle() {
  if (sw.id) { clearInterval(sw.id); sw.id = 0; return; }
  const start = Date.now() - sw.t;
  sw.id = setInterval(() => { sw.t = Date.now() - start; const e = $('#swd'); if (e) e.textContent = fmt(sw.t); }, 100);
}
// ---- Big countdown timer: hours / minutes / seconds, pause, reset, fullscreen ----
let cd = { total: 0, left: 0, end: 0, id: 0 };
const hms = ms => { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function cdPaint() {
  const e = $('#cd'); if (!e) return;
  e.textContent = cd.left ? hms(cd.left) : '00:00';
  const r = $('#ring'); if (r) r.style.strokeDashoffset = 565 * (1 - (cd.total ? cd.left / cd.total : 0));
  const b = $('#cgo'); if (b) b.textContent = cd.id ? '⏸' : '▶';
}
function cdReset() { clearInterval(cd.id); cd.id = 0; cd.total = cd.left = 0; cdPaint(); }
function cdSet(sec) {                       // preset buttons
  cdReset(); $('#ch').value = Math.floor(sec / 3600); $('#cm').value = Math.floor(sec % 3600 / 60); $('#cs').value = sec % 60;
}
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(() => o.stop(), 900); if (navigator.vibrate) navigator.vibrate(400); } catch (e) {} }
function cdToggle() {
  if (cd.id) { clearInterval(cd.id); cd.id = 0; cd.left = cd.end - Date.now(); cdPaint(); return; }   // pause
  if (!cd.left) {
    const s = (+$('#ch').value || 0) * 3600 + (+$('#cm').value || 0) * 60 + (+$('#cs').value || 0);
    if (!(s > 0)) return toast('Please enter a valid amount.');
    cd.total = cd.left = s * 1000;
  }
  cd.end = Date.now() + cd.left;
  cd.id = setInterval(() => {
    cd.left = cd.end - Date.now();
    if (cd.left <= 0) { cdReset(); toast('⏰ Time is up!'); beep(); return; }
    cdPaint();
  }, 200);
  cdPaint();
}
function cdFull() { const c = $('#cdcard'); (c.requestFullscreen || c.webkitRequestFullscreen || (() => toast('Fullscreen is not supported here'))).call(c); }

const tools = () => `<div class="card"><h3>⏱ Stopwatch</h3><h1 id="swd">${fmt(sw.t)}</h1><button class="btn" onclick="swToggle()">Start / Stop</button> <button class="btn ghost" onclick="sw.t=0;$('#swd').textContent=fmt(0)">Reset</button></div>
<div class="card" id="cdcard"><h3>⏳ Timer</h3>
<div class="tm"><label>Hours<input id="ch" type="number" min="0" value="0" oninput="cdReset()"></label><label>Minutes<input id="cm" type="number" min="0" value="25" oninput="cdReset()"></label><label>Seconds<input id="cs" type="number" min="0" value="0" oninput="cdReset()"></label></div>
<div class="tm"><button class="btn ghost" onclick="cdSet(300)">5 min</button><button class="btn ghost" onclick="cdSet(900)">15 min</button><button class="btn ghost" onclick="cdSet(1500)">25 min</button><button class="btn ghost" onclick="cdSet(3600)">1 h</button></div>
<div class="ringbox"><svg viewBox="0 0 200 200"><circle class="rbg" cx="100" cy="100" r="90"/><circle id="ring" class="rfg" cx="100" cy="100" r="90" style="stroke-dashoffset:${565 * (1 - (cd.total ? cd.left / cd.total : 0))}"/></svg><div id="cd">${cd.left ? hms(cd.left) : '00:00'}</div></div>
<div class="tm"><button class="btn" id="cgo" onclick="cdToggle()">${cd.id ? '⏸' : '▶'}</button><button class="btn ghost" onclick="cdReset()">↺</button><button class="btn ghost" onclick="cdFull()">⛶</button></div></div>`;

/* ================= SETTINGS ================= */
function setView() {
  const langs = [['en', '🇬🇧 English'], ['hy', '🇦🇲 Հայերեն'], ['ru', '🇷🇺 Русский']];
  return `<div class="card"><label class="row">${tr('dark')}<input type="checkbox" ${settings.dark ? 'checked' : ''} onchange="settings.dark=this.checked;saveSettings();render()"></label>
  <label class="row">${tr('lang')}<select onchange="settings.lang=this.value;saveSettings();render()">${langs.map(([c, n]) => `<option value="${c}" ${settings.lang === c ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
  <label class="row">24h<input type="checkbox" ${settings.h24 ? 'checked' : ''} onchange="settings.h24=this.checked;saveSettings();tick()"></label></div>
  <div class="card grid"><button class="btn" onclick="exportData()">${tr('export')}</button><label class="btn ghost">${tr('import')}<input type="file" accept=".json" hidden onchange="importData(event)"></label><button class="btn danger" onclick="resetAll()">${tr('reset')}</button></div>`;
}
function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = 'my-day-backup.json'; a.click();
}
function importData(e) {
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); KEYS.forEach(k => { db[k] = Array.isArray(d[k]) ? d[k] : []; saveKey(k); }); render(); toast('✔'); }
    catch { toast('Invalid backup file.'); }
  };
  r.readAsText(e.target.files[0]);
}
function resetAll() { modal(`<p>${tr('sure')}</p>`, () => { localStorage.clear(); location.reload(); }, '🗑'); }

/* ================= NAVIGATION + RENDER ================= */
const NAV = [['home','🏠'],['tasks','✅'],['messages','✉️'],['notes','📝'],['reminders','🔔'],['expenses','💰'],['shopping','🛒'],['contacts','👤'],['goals','🎯'],['tools','⏱'],['settings','⚙️']];
const V = { home, messages: msgView, tools, settings: setView };
function go(k) { view = k; q = ''; render(); }
function render() {
  document.body.classList.toggle('dark', settings.dark);
  $('#nav').innerHTML = NAV.map(([k, i]) => `<a class="${k === view ? 'on' : ''}" onclick="go('${k}')"><span>${i}</span><em>${tr(k)}</em></a>`).join('');
  $('#title').textContent = tr(view);
  $('#addBtn').style.display = M[view] || view === 'messages' ? '' : 'none';
  $('#view').innerHTML = V[view] ? V[view]() : modView(view);
}
$('#addBtn').onclick = () => view === 'messages' ? openMsg() : openForm(view);

/* ================= CLOCK, REMINDER POPUPS, SHORTCUTS ================= */
function tick() { $('#clock').textContent = new Date().toLocaleTimeString([], { hour12: !settings.h24 }); }
setInterval(tick, 1000);
// When a reminder's time arrives, show an in-app popup once.
setInterval(() => {
  const n = new Date(), d = todayStr(), t = n.toTimeString().slice(0, 5);
  db.reminders.forEach(r => { if (!r.fired && r.date === d && r.time && r.time <= t) { r.fired = 1; saveKey('reminders'); toast('🔔 ' + r.title); } });
}, 15000);
// Shortcuts: N = new item, Esc = closeModal window
document.onkeydown = e => {
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'n' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#addBtn').style.display !== 'none') { e.preventDefault(); $('#addBtn').click(); }
};
tick(); render();

window.onerror=(m)=>toast('Error: '+m);

</script></body></html>
